[templates]
log = '''
separate(" ",
  label("change_id", change_id.shortest(8)),
  label("author", replace(regex:"^[0-9+]*(.*)", author.email().local(), |w| w.get(1) )),
  format_timestamp(committer.timestamp()),
  bookmarks,
  tags,
  working_copies,
  if(conflict, label("conflict", "conflict"))
) ++ "\n" ++
separate("",
  if(description && empty, separate(" ", "(empty)", description.first_line()), ""),
  if(description && !empty, description.first_line(), ""),
  if(!description && empty, "(empty) (no description set)", ""),
  if(!description && !empty, "(no description set)", "")
)
'''
[template-aliases]
# Username part of the email address
'username_signature(signature)' = 'signature.email().local()'

[aliases]
tug = ["bookmark", "move", "--from", "closest_bookmark(@)", "--to", "closest_pushable(@)"]
init = ["git", "init", "--colocate"]
cm = ["commit", "-m"]
gf = ["git", "fetch"]
gp = ["git", "push"]
rebase-trunk = ["rebase", "-r", "::@ ~ ::trunk()", "-d", "trunk()"]
bt = ["util", "exec", "--", 'sh', '-euc', '''
  B=$(jj bookmark list --all -T 'name ++ "\n"' | sort | uniq | fzf -m)
  if [ -n "$B" ]; then
    jj b track --remote=origin $B > /dev/null 2>&1
    echo "Tracking: $(echo $B)"
    jj b l --tracked
  fi
''' ]
bu = ["util", "exec", "--", 'sh', '-euc', '''
  B=$(jj b l --tracked -T 'name ++ "\n"' | sort | uniq | fzf -m)
  if [ -n "$B" ]; then
    jj b untrack --remote=origin $B > /dev/null 2>&1
    echo "Untracked: $(echo $B)"
    jj b l --tracked
  fi
''' ]
bf = ["util", "exec", "--", 'sh', '-euc', '''
  B=$(jj b l --tracked -T 'name ++ "\n"' | sort | uniq | fzf -m)
  if [ -n "$B" ]; then
    jj b forget $B > /dev/null 2>&1
    echo "Forgot: $(echo $B)"
    jj b l --tracked
  fi
''' ]

[git]
subprocess = true
sign-on-push = true

[revsets]
log = "present(@) | ancestors(immutable_heads().., 2) | present(trunk())"

[revset-aliases]
'closest_bookmark(to)' = 'heads(::to & bookmarks())'
'closest_pushable(to)' = 'heads(::to & mutable() & ~description(exact:"") & (~empty() | merges()))'
"recent()" = 'committer_date(after:"1 month ago")'

[signing]
behaviour = "own"
backend = "ssh"
key = "~/.ssh/id_ed25519.pub"

[signing.backends]
"ssh.allowed-signers" = "/home/mike/.ssh/allowed_signers"
"ssh.program" = "/usr/bin/ssh-keygen"

[user]
name = "Michael Park"
email = "me@mhpark.me"

[ui]
default-command = "log"
diff-formatter = ":git"
editor = "nvim"
pager = "delta"
conflict-marker-style = "git"

[merge-tools.delta-catppuccin-mocha]
program = "delta"
diff-args = ["--width", "$width", "--features", "rose-pine", "$left", "$right"]
diff-expected-exit-codes = [0, 1]

[[--scope]]
--when.environments = ["JJUI"]
[--scope.ui]
diff-formatter = "delta"
