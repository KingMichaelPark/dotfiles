[ui]
theme = "rose-pine"


[preview]
file_command = ["diff", "--ignore-working-copy", "--color", "always", "-r", "$change_id", "$file", "--config", "ui.diff-formatter=delta"]
oplog_command = ["op", "show", "$operation_id", "--color", "always"]
revision_command = ["show", "--ignore-working-copy",  "--color", "always", "-r", "$change_id", "--config", "ui.diff-formatter=delta"]
position = "auto" # auto, bottom, or right
width_percentage = 60.0
height_percentage = 60.0
show_at_start = false
